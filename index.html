<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Indian Stock LTP</title>  <link rel="stylesheet" href="style.css">
</head><body>  <main class="container"><h1>Indian Stock LTP</h1>

<div class="search-box">
  <input
    id="symbolInput"
    type="text"
    placeholder="Enter symbol e.g. RELIANCE"
    value="RELIANCE"
  >

  <button id="getPriceBtn">
    Get LTP
  </button>
</div>

<div class="card">

  <div id="symbol" class="symbol">
    RELIANCE
  </div>

  <div id="price" class="price">
    ₹--
  </div>

  <div id="status" class="status">
    Ready
  </div>

</div>

  </main>  <script src="app.js"></script></body>
</html>
